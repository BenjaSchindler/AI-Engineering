<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">RAG multimedia · encontrar la evidencia original</title><desc id="desc">Imágenes, audio y video se separan en unidades con ubicación y permisos.</desc><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="0" y="0" width="900" height="300" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="36" font-size="17" font-weight="600" fill="#5F5E5A">RAG multimedia · encontrar la evidencia original</text><g transform="translate(48,75) scale(0.8)" fill="none" stroke="#534AB7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="12" width="78" height="70" rx="7"/><circle cx="61" cy="32" r="7"/><path d="M8 71 L31 45 L48 62 L60 51 L82 73"/></g><text x="30" y="181" font-size="16" font-weight="600" fill="#534AB7">Imagen / PDF</text><g transform="translate(186,75) scale(0.8)" fill="none" stroke="#534AB7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 40 V55 M23 22 V73 M37 9 V87 M51 29 V66 M65 16 V79 M79 38 V59"/></g><text x="168" y="181" font-size="16" font-weight="600" fill="#534AB7">Audio</text><g transform="translate(318,75) scale(0.8)" fill="none" stroke="#534AB7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="14" width="80" height="64" rx="7"/><path d="M35 31 L58 46 L35 62 Z M17 87 H70"/></g><text x="300" y="181" font-size="16" font-weight="600" fill="#534AB7">Video</text><path d="M401 132 H440 m-8 -6 l8 6 -8 6" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="462" y="70" width="189" height="161" rx="12" fill="#FAEEDA" stroke="none"/><text x="481" y="106" font-size="22" font-weight="600" fill="#854F0B">Unidades</text><text x="481" y="135" font-size="21" font-weight="600" fill="#854F0B">recuperables</text><text x="481" y="175" font-size="17" font-weight="400" fill="#854F0B">Página / región</text><text x="481" y="202" font-size="17" font-weight="400" fill="#854F0B">Escena / tiempo</text><path d="M663 132 H697 m-8 -6 l8 6 -8 6" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="718" y="70" width="156" height="161" rx="12" fill="#E1F5EE" stroke="none"/><text x="734" y="108" font-size="21" font-weight="600" fill="#0F6E56">Evidencia</text><text x="734" y="150" font-size="19" font-weight="400" fill="#0F6E56">Original</text><text x="734" y="178" font-size="18" font-weight="400" fill="#0F6E56">+ ubicación</text><text x="734" y="205" font-size="18" font-weight="400" fill="#0F6E56">+ permisos</text><text x="28" y="281" font-size="19" font-weight="400" fill="#30302E">Recuperar → ver u oír la evidencia → responder con página o timestamp.</text></g></svg>