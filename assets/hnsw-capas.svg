<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-labelledby="title desc"><title id="title">HNSW por capas</title><desc id="desc">Tres capas alineadas con un recorrido resaltado. Se baja conservando el mismo nodo; en la base se exploran varios candidatos.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="572" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">HNSW · DE SALTOS LARGOS A VECINOS CERCANOS</text><rect x="24" y="65" width="852" height="114" rx="12" fill="#F1F0FC" stroke="none"/><text x="42" y="96" font-size="22" fill="#534AB7" font-weight="600">Capa 2</text><text x="42" y="127" font-size="17" fill="#68675F" font-weight="400">Pocos nodos</text><text x="42" y="152" font-size="17" fill="#68675F" font-weight="400">Orientar la búsqueda</text><rect x="24" y="215" width="852" height="114" rx="12" fill="#F1F0FC" stroke="none"/><text x="42" y="246" font-size="22" fill="#534AB7" font-weight="600">Capa 1</text><text x="42" y="277" font-size="17" fill="#68675F" font-weight="400">Más conexiones</text><text x="42" y="302" font-size="17" fill="#68675F" font-weight="400">Acercarse a la zona</text><rect x="24" y="365" width="852" height="114" rx="12" fill="#EAF5EF" stroke="none"/><text x="42" y="396" font-size="22" fill="#0F6E56" font-weight="600">Capa 0</text><text x="42" y="427" font-size="17" fill="#68675F" font-weight="400">Todos los vectores</text><text x="42" y="452" font-size="17" fill="#68675F" font-weight="400">Explorar candidatos</text><path d="M380 122 H710" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M730 142 V251" stroke="#0