"19" stroke="#534AB7" stroke-width="2" fill="#FBFAF7"/><text x="353" y="428" font-size="18" fill="#534AB7" font-weight="600">A</text><circle cx="430" cy="422" r="19" stroke="#534AB7" stroke-width="2" fill="#FBFAF7"/><text x="423" y="428" font-size="18" fill="#534AB7" font-weight="600">F</text><circle cx="520" cy="422" r="19" stroke="#0F6E56" stroke-width="2" fill="#E1F5EE"/><text x="513" y="428" font-size="18" fill="#0F6E56" font-weight="600">C</text><circle cx="620" cy="422" r="19" stroke="#0F6E56" stroke-width="2" fill="#E1F5EE"/><text x="613" y="428" font-size="18" fill="#0F6E56" font-weight="600">D</text><circle cx="730" cy="422" r="19" stroke="#0F6E56" stroke-width="2" fill="#E1F5EE"/><text x="723" y="428" font-size="18" fill="#0F6E56" font-weight="600">B</text><circle cx="800" cy="422" r="19" stroke="#534AB7" stroke-width="2" fill="#FBFAF7"/><text x="793" y="428" font-size="18" fill="#534AB7" font-weight="600">E</text><text x="285" y="97" font-size="15" fill="#0F6E56" font-weight="400">entrada</text><text x="745" y="204" font-size="15" fill="#0F6E56" font-weight="400">bajar</text><text x="535" y="353" font-size="15" fill="#0F6E56" font-weight="400">bajar</text><text x="28" y="515" font-size="19" fill="#30302E" font-weight="600">Arriba: avanzar hacia la query. Abajo: ampliar candidatos y elegir top-k.</text><text x="28" y="547" font-size="17" fill="#68675F" font-weight="400">Verde = recorrido ilustrativo. La misma letra es el mismo vector en otra capa.</text></g></svg>
