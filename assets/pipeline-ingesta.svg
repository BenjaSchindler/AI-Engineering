<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc"><title id="title">Pipeline de ingesta</title><desc id="desc">Ocho pasos numerados en dos filas: fuentes, conector, normalización, identidad, deduplicación, chunking, embedding y Vector DB. Sync, caché y permisos acompañan el proceso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="1200" height="495" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="15" fill="#68675F" font-weight="600">DE LA FUENTE AL ÍNDICE</text><text x="28" y="67" font-size="26" fill="#30302E" font-weight="600">Preparar → identificar → representar</text><rect x="28" y="95" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="121" font-size="14" fill="#534AB7" font-weight="600">01</text><text x="44" y="150" font-size="22" fill="#534AB7" font-weight="600">Fuentes</text><text x="44" y="178" font-size="17" fill="#534AB7" font-weight="400">Docs, web, archivos</text><rect x="318" y="95" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="334" y="121" font-size="14" fill="#534AB7" font-weight="600">02</text><text x="334" y="150" font-size="22" fill="#534AB7" font-weight="600">Connector</text><text x="334" y="178" font-size="17" fill="#534AB7" font-weight="400">Traer datos y permisos</text><rect x="608" y="95" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="624" y="121" font-size="14" fill="#534AB7" font-weight="600">03</text><text x="624" y="150" font-size="22" fill="#534AB7" font-weight="600">Normalization</text><text x="624" y="178" font-size="17" fill="#534AB7" font-weight="400">Limpiar y estructurar</text><rect x="898" y="95" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="914" y="121" font-size="14" fill="#534AB7" font-weight="600">04</text><text x="914" y="150" font-size="22" fill="#534AB7" font-weight="600">Document IDs</text><text x="914" y="178" font-size="17" fill="#534AB7" font-weight="400">Identidad estable</text><path d="M281 147 H310" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M571 147 H600" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M861 147 H890" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M1150 147 H1174 V266 H1151" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="898" y="214" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="914" y="240" font-size="14" fill="#534AB7" font-weight="600">05</text><text x="914" y="269" font-size="22" fill="#534AB7" font-weight="600">Deduplication</text><text x="914" y="297" font-size="17" fill="#534AB7" font-weight="400">Eliminar duplicados</text><rect x="608" y="214" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="624" y="240" font-size="14" fill="#534AB7" font-weight="600">06</text><text x="624" y="269" font-size="22" fill="#534AB7" font-weight="600">Chunking</text><text x="624" y="297" font-size="17" fill="#534AB7" font-weight="400">Una idea por fragmento</text><rect x="318" y="214" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="334" y="240" font-size="14" fill="#534AB7" font-weight="600">07</text><text x="334" y="269" font-size="22" fill="#534AB7" font-weight="600">Embedding</text><text x="334" y="297" font-size="17" fill="#534AB7" font-weight="400">Representar significado</text><rect x="28" y="214" width="250" height="104" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="44" y="240" font-size="14" fill="#0F6E56" font-weight="600">08</text><text x="44" y="269" font-size="22" fill="#0F6E56" font-weight="600">Vector DB</text><text x="44" y="297" font-size="17" fill="#0F6E56" font-weight="400">Vectores + metadata</text><path d="M315 266 H284" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M605 266 H574" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M895 266 H864" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><text x="28" y="357" font-size="14" fill="#68675F" font-weight="600">CONTROLES QUE ACOMPAÑAN EL FLUJO</text><rect x="28" y="375" width="364" height="98" rx="12" fill="#FAEEDA" stroke="none"/><text x="44" y="403" font-size="21" fill="#854F0B" font-weight="600">↻  Incremental sync</text><text x="44" y="432" font-size="16" fill="#854F0B" font-weight="400">Decide qué cambió y qué borrar.</text><text x="44" y="456" font-size="16" fill="#854F0B" font-weight="400">Actúa desde el conector.</text><rect x="418" y="375" width="364" height="98" rx="12" fill="#FAEEDA" stroke="none"/><text x="434" y="403" font-size="21" fill="#854F0B" font-weight="600">Caching</text><text x="434" y="432" font-size="16" fill="#854F0B" font-weight="400">Reutiliza embeddings compatibles.</text><text x="434" y="456" font-size="16" fill="#854F0B" font-weight="400">Evita volver a calcular el paso 07.</text><rect x="808" y="375" width="364" height="98" rx="12" fill="#FAEEDA" stroke="none"/><text x="824" y="403" font-size="21" fill="#854F0B" font-weight="600">ACLs · permisos</text><text x="824" y="432" font-size="16" fill="#854F0B" font-weight="400">Viajan desde la fuente al chunk.</text><text x="824" y="456" font-size="16" fill="#854F0B" font-weight="400">Se aplican también al consultar.</text><path d="M758 385 L745 402 H756 L750 419 L771 394 H759 Z" fill="none" stroke="#854F0B" stroke-width="2.5" stroke-linejoin="round"/><g fill="none" stroke="#854F0B" stroke-width="2.5"><path d="M1135 392 v-5 a8 8 0 0 1 16 0 v5"/><rect x="1131" y="392" width="24" height="20" rx="4"/></g></g></svg>
