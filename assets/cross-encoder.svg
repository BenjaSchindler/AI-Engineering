<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">CROSS-ENCODER · LEER CADA PAR JUNTO</title><desc id="desc">Cada consulta y pasaje entran juntos al modelo. Sus scores permiten reordenar los candidatos antes de formar el contexto.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#FBFAF7"/>
<g font-family="DejaVu Sans,sans-serif"><text x="28" y="36" font-size="17" fill="#68675F" font-weight="600">CROSS-ENCODER · LEER CADA PAR JUNTO</text><rect x="28" y="64" width="260" height="164" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="96" font-size="21" fill="#534AB7" font-weight="600">Pares de entrada</text><text x="44" y="126" font-size="17" fill="#534AB7" font-weight="400">Consulta + pasaje A</text><text x="44" y="152" font-size="17" fill="#534AB7" font-weight="400">Consulta + pasaje B</text><text x="44" y="178" font-size="17" fill="#534AB7" font-weight="400">Consulta + pasaje C</text><rect x="320" y="64" width="260" height="164" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="96" font-size="21" fill="#534AB7" font-weight="600">Lectura conjunta</text><text x="336" y="126" font-size="17" fill="#534AB7" font-weight="400">Mismo modelo</text><text x="336" y="152" font-size="17" fill="#534AB7" font-weight="400">Score de relevancia</text><rect x="612" y="64" width="260" height="164" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="628" y="96" font-size="21" fill="#0F6E56" font-weight="600">Reordenar</text><text x="628" y="126" font-size="17" fill="#0F6E56" font-weight="400">B → A → C</text><text x="628" y="152" font-size="17" fill="#0F6E56" font-weight="400">Elegir los mejores</text><path d="M290 146 H316" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M582 146 H608" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="320" y="267" width="552" height="65" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="336" y="299" font-size="21" fill="#0F6E56" font-weight="600">50 candidatos → 5 pasajes → contexto</text><path d="M742 230 V263" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="28" y="290" font-size="17" fill="#444441" font-weight="400">Ejemplo de recorte.</text><text x="28" y="318" font-size="17" fill="#444441" font-weight="400">Reranking opcional.</text></g></svg>
