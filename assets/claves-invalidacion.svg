<svg xmlns="http://www.w3.org/2000/svg" width="900" height="652" viewBox="0 0 900 652" role="img" aria-labelledby="title desc">
<title id="title">Claves e invalidación de caché · la cotización que no debía volver</title>
<desc id="desc">Arriba, los factores que forman la clave de una respuesta: cliente y alcance, pregunta normalizada, versión de la póliza y sus endosos, y versiones de prompt, modelo y tools. Abajo, una línea de tiempo: a las 10:00 se cachea una cotización de 1.240 EUR con la póliza v3; a las 10:20 un endoso la pasa a v4; a las 10:25 llega la misma pregunta. Con una clave sin versión hay un hit y reaparece 1.240 EUR hasta que vence el TTL a las 11:00. Con la versión en la clave e invalidación al escribir, hay un miss y se recalcula 1.310 EUR. Al actualizar, primero se escribe en la fuente y después se invalida.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect x="0" y="0" width="900" height="652" rx="12" fill="#FBFAF7"/>
<text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">CLAVES E INVALIDACIÓN · LA COTIZACIÓN QUE NO DEBÍA VOLVER</text>
<text x="28" y="66" font-size="14" fill="#444441" font-weight="600">Qué entra en la clave de una respuesta</text>
<rect x="28" y="80" width="150" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="103.0" y="102" font-size="13" fill="#444441" text-anchor="middle" font-weight="400">cliente A · alcance</text>
<rect x="186" y="80" width="162" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="267.0" y="102" font-size="13" fill="#444441" text-anchor="middle" font-weight="400">pregunta normalizada</text>
<rect x="356" y="80" width="196" height="34" rx="17" fill="#FAEEDA" stroke="#854F0B"/>
<text x="454.0" y="102" font-size="13" fill="#854F0B" text-anchor="middle" font-weight="600">póliza P-17 v4 + endosos</text>
<rect x="560" y="80" width="170" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="645.0" y="102" font-size="13" fill="#444441" text-anchor="middle" font-weight="400">prompt · modelo · tools</text>
<text x="454" y="132" font-size="11.5" fill="#854F0B" text-anchor="middle">el factor que más se olvida</text>
<path d="M736 97 H758" stroke="#68675F" stroke-width="2" marker-end="url(#arr)"/>
<text x="762" y="102" font-size="13" fill="#444441" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hash</text>
<text x="762" y="120" font-size="11" fill="#888780">clave estable</text>
<path d="M28 160 H872" stroke="#B4B2A9" stroke-dasharray="2 4" fill="none"/>
<text x="28" y="190" font-size="14" fill="#444441" font-weight="600">Misma pregunta, antes y después de un endoso</text>
<path d="M200 228 H852" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M200.0 223 V233" stroke="#68675F" stroke-width="1.5"/>
<text x="200.0" y="218" font-size="12" fill="#888780" text-anchor="middle">10:00</text>
<path d="M417.3 223 V233" stroke="#68675F" stroke-width="1.5"/>
<text x="417.3" y="218" font-size="12" fill="#888780" text-anchor="end">10:20</text>
<path d="M471.7 223 V233" stroke="#68675F" stroke-width="1.5"/>
<text x="471.7" y="218" font-size="12" fill="#888780" text-anchor="start">10:25</text>
<path d="M852.0 223 V233" stroke="#68675F" stroke-width="1.5"/>
<text x="852.0" y="218" font-size="12" fill="#888780" text-anchor="middle">11:00</text>
<text x="200.0" y="250" font-size="12" fill="#444441">se cachea 1.240 EUR con la póliza v3</text>
<text x="411.3" y="268" font-size="12" fill="#854F0B" font-weight="600" text-anchor="end">endoso: P-17 pasa a v4</text>
<text x="475.7" y="250" font-size="12" fill="#185FA5" font-weight="600">llega la misma pregunta</text>
<text x="852.0" y="250" font-size="12" fill="#888780" text-anchor="end">vence el TTL (60 min)</text>
<rect x="28" y="290" width="844" height="96" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="44" y="316" font-size="14" fill="#993C1D" font-weight="600">Clave sin versión</text>
<text x="44" y="335" font-size="12" fill="#993C1D">pregunta + cliente</text>
<rect x="417.3" y="302" width="434.7" height="22" rx="4" fill="#993C1D" opacity="0.14"/>
<text x="634.7" y="318" font-size="12" fill="#993C1D" text-anchor="middle">40 min en los que la caché sirve un dato viejo</text>
<rect x="471.7" y="334" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#993C1D"/>
<text x="485.7" y="359" font-size="14" fill="#993C1D" font-weight="700">HIT → 1.240 EUR</text>
<text x="613.7" y="359" font-size="12" fill="#993C1D">la cotización vieja</text>
<rect x="28" y="402" width="844" height="96" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="44" y="428" font-size="14" fill="#0F6E56" font-weight="600">Con versión e invalidación</text>
<text x="44" y="447" font-size="12" fill="#0F6E56">la clave incluye P-17 v4</text>
<rect x="353.3" y="414" width="128" height="22" rx="4" fill="#FFFFFF" stroke="#0F6E56"/>
<text x="417.3" y="429" font-size="11.5" fill="#0F6E56" text-anchor="middle">invalidar P-17</text>
<rect x="471.7" y="446" width="330" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56"/>
<text x="485.7" y="471" font-size="14" fill="#0F6E56" font-weight="700">MISS → recalcula 1.310 EUR</text>
<text x="693.7" y="471" font-size="12" fill="#0F6E56">con la v4</text>
<path d="M417.3 276 V498" stroke="#68675F" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
<path d="M471.7 276 V498" stroke="#68675F" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
<text x="28" y="534" font-size="14" fill="#444441" font-weight="600">Al actualizar, el orden importa</text>
<rect x="28" y="546" width="190" height="38" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="123" y="570" font-size="13" fill="#444441" text-anchor="middle">1 · escribir en la fuente</text>
<path d="M220 565 H246" stroke="#68675F" stroke-width="2" marker-end="url(#arr)"/>
<rect x="250" y="546" width="190" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="345" y="570" font-size="13" fill="#0F6E56" text-anchor="middle">2 · invalidar la caché</text>
<text x="462" y="561" font-size="12.5" fill="#993C1D">Al revés, una lectura entre los dos pasos vuelve</text>
<text x="462" y="579" font-size="12.5" fill="#993C1D">a leer el dato viejo y lo guarda otra vez en la caché.</text>
<text x="28" y="618" font-size="15" fill="#444441">El TTL fija cuánto dura una entrada; no avisa que el dato cambió.</text>
<text x="28" y="642" font-size="13" fill="#888780">Montos ilustrativos. Orden de escritura e invalidación según el patrón cache-aside (Microsoft), consultado el 25-09-2026.</text>
</g></svg>
