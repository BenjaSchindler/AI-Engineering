<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" role="img" aria-labelledby="title desc"><title id="title">Búsqueda híbrida · dos listas, una fusión y un reranker</title><desc id="desc">Consulta “error E104 al iniciar sesión”. BM25 ordena B, A, E, C; la búsqueda vectorial ordena C, D, A, F. RRF con k = 60 suma 1/(60 + posición) por lista: C 0,03202, A 0,03200, B 0,01639, D 0,01613, E 0,01587, F 0,01563. El reranker ordena A 0,94, C 0,81, B 0,27, E 0,18, D 0,09, F 0,04 y pasa A y C al contexto.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="636" rx="12" fill="#FBFAF7" stroke="none"/>
