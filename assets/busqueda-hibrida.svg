<text x="28" y="560" font-size="15" fill="#444441">B era 1.º en BM25 y queda 3.º: en RRF, aparecer en las dos listas pesa más que ganar una.</text>
<text x="28" y="584" font-size="15" fill="#0F6E56">El reranker sube A (qué es E104) y C (cómo resolverlo); no puede rescatar lo que no llegó.</text>
<text x="28" y="614" font-size="13" fill="#888780">k = 60, el valor por defecto en Elasticsearch. Puntajes del reranker ilustrativos.</text>
