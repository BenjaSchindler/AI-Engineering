<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Chunking · cortar por ideas</title><desc id="desc">Un documento se divide en fragmentos con sentido propio y una zona de overlap.</desc><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="0" y="0" width="900" height="300" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="36" font-size="17" font-weight="600" fill="#5F5E5A">Chunking · cortar por ideas</text><g transform="translate(32,89) scale(1.2)" fill="none" stroke="#534AB7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 H58 L78 24 V92 H16 Z M58 4 V24 H78 M28 40 H64 M28 53 H64 M28 66 H54"/></g><text x="30" y="248" font-size="18" font-weight="600" fill="#534AB7">Documento</text><path d="M155 155 H208 m-8 -6 l8 6 -8 6" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="235" y="79" width="290" height="139" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="255" y="117" font-size="25" font-weight="600" fill="#534AB7">Una idea</text><text x="255" y="151" font-size="19" font-weight="400" fill="#534AB7">Título + contenido</text><path d="M255 170 h220" fill="none" stroke="#534AB7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M255 188 h166" fill="none" stroke="#534AB7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="553" y="79" width="290" height="139" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="573" y="117" font-size="25" font-weight="600" fill="#534AB7">Otra idea</text><text x="573" y="151" font-size="19" font-weight="400" fill="#534AB7">Título + contenido</text><path d="M573 170 h220" fill="none" stroke="#534AB7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M573 188 h166" fill="none" stroke="#534AB7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="487" y="158" width="106" height="60" rx="12" fill="#FAEEDA" stroke="#854F0B"/><text x="497" y="195" font-size="18" font-weight="600" fill="#854F0B">overlap</text><text x="28" y="281" font-size="19" font-weight="400" fill="#30302E">Tamaño = tokens de entrada. Compartí el borde solo cuando aporte contexto.</text></g></svg>