<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528" role="img" aria-labelledby="title desc"><title id="title">IVF por listas</title><desc id="desc">Cuatro listas y una consulta que selecciona dos. Solo se buscan vectores en las listas elegidas y luego se reúne el top-k.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="528" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="18" fill="#68675F" font-weight="600">IVF · ELEGIR GRUPOS, BUSCAR DENTRO</text><rect x="28" y="66" width="240" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="92" font-size="14" fill="#534AB7" font-weight="600">CONSULTA</text><text x="44" y="122" font-size="22" fill="#534AB7" font-weight="600">Query</text><text x="44" y="150" font-size="17" fill="#534AB7" font-weight="400">Su vector de embedding</text><path d="M272 122 H307" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="316" y="66" width="556" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="332" y="92" font-size="14" fill="#534AB7" font-weight="600">SELECCIÓN</text><text x="332" y="122" font-size="22" fill="#534AB7" font-weight="600">Centroides cercanos</text><text x="332" y="150" font-size="17" fill="#534AB7" font-weight="400">Ejemplo: nlist = 4 · nprobe = 2</text><rect x="28" y="223" width="190" height="135" rx="12" fill="#F1EFE8" stroke="#68675F"/><text x="44" y="251" font-size="22" fill="#68675F" font-weight="600">Lista 1</text><circle cx="53" cy="279" r="5" fill="#68675F"/><circle cx="90" cy="295" r="5" fill="#68675F"/><circle cx="140" cy="276" r="5" fill="#68675F"/><circle cx="172" cy="310" r="5" fill="#68675F"/><circle cx="73" cy="327" r="5" fill="#68675F"/><text x="44" y="344" font-size="16" fill="#68675F" font-weight="400">sin explorar</text><rect x="246" y="223" width="190" height="135" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="262" y="251" font-size="22" fill="#0F6E56" font-weight="600">Lista 2</text><circle cx="271" cy="279" r="5" fill="#0F6E56"/><circle cx="308" cy="295" r="5" fill="#0F6E56"/><circle cx="358" cy="276" r="5" fill="#0F6E56"/><circle cx="390" cy="310" r="5" fill="#0F6E56"/><circle cx="291" cy="327" r="5" fill="#0F6E56"/><text x="262" y="344" font-size="16" fill="#0F6E56" font-weight="400">buscar aquí</text><rect x="464" y="223" width="190" height="135" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="480" y="251" font-size="22" fill="#0F6E56" font-weight="600">Lista 3</text><circle cx="489" cy="279" r="5" fill="#0F6E56"/><circle cx="526" cy="295" r="5" fill="#0F6E56"/><circle cx="576" cy="276" r="5" fill="#0F6E56"/><circle cx="608" cy="310" r="5" fill="#0F6E56"/><circle cx="509" cy="327" r="5" fill="#0F6E56"/><text x="480" y="344" font-size="16" fill="#0F6E56" font-weight="400">buscar aquí</text><rect x="682" y="223" width="190" height="135" rx="12" fill="#F1EFE8" stroke="#68675F"/><text x="698" y="251" font-size="22" fill="#68675F" font-weight="600">Lista 4</text><circle cx="707" cy="279" r="5" fill="#68675F"/><circle cx="744" cy="295" r="5" fill="#68675F"/><circle cx="794" cy="276" r="5" fill="#68675F"/><circle cx="826" cy="310" r="5" fill="#68675F"/><circle cx="727" cy="327" r="5" fill="#68675F"/><text x="698" y="344" font-size="16" fill="#68675F" font-weight="400">sin explorar</text><path d="M341 180 V220" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M559 180 V220" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M341 360 V384 H450 V401" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M559 360 V384 H450" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="28" y="406" width="844" height="61" rx="12" fill="#EEEDFE" stroke="none"/><text x="48" y="431" font-size="21" fill="#534AB7" font-weight="600">Comparar vectores de las listas elegidas → reunir top-k</text><text x="48" y="455" font-size="17" fill="#534AB7" font-weight="400">Si el vecino estaba en otra lista, puede quedar fuera.</text><text x="28" y="504" font-size="18" fill="#68675F" font-weight="400">Antes de consultar: entrenar centroides y asignar cada vector a una lista.</text></g></svg>
