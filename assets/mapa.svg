<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#FBFAF7"/>

  <!-- Retrieval -->
  <rect x="20" y="20" width="860" height="220" rx="14" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="36" y="44" font-size="14" font-weight="600" fill="#444441">Retrieval</text>

  <g>
    <rect x="40" y="64" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="140" y="84" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Vector DB</text>
    <text x="140" y="104" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">pipeline de ingesta</text>
  </g>
  <g>
    <rect x="40" y="144" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="140" y="164" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">ANN / HNSW</text>
    <text x="140" y="184" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">índice para muchos docs</text>
  </g>

  <!-- Pipeline de ingesta -->
  <rect x="270" y="52" width="596" height="156" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="284" y="72" font-size="12" font-weight="600" fill="#5F5E5A">Pipeline de ingesta · las 7 preguntas</text>
  <line x1="268" y1="92" x2="246" y2="92" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <g>
    <rect x="282" y="84" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="349" y="102" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Connector</text>
    <text x="349" y="118" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">cómo obtengo los datos</text>
  </g>
  <g>
    <rect x="428" y="84" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="495" y="102" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Normalization</text>
    <text x="495" y="118" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">misma forma para todo</text>
  </g>
  <g>
    <rect x="574" y="84" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="641" y="102" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Document IDs</text>
    <text x="641" y="118" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">mismo doc en el tiempo</text>
  </g>
  <g>
    <rect x="720" y="84" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="787" y="102" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Deduplication</text>
    <text x="787" y="118" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">nada repetido</text>
  </g>
  <g>
    <rect x="282" y="148" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="349" y="166" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Incremental sync</text>
    <text x="349" y="182" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">solo lo que cambió</text>
  </g>
  <g>
    <rect x="428" y="148" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="495" y="166" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Caching</text>
    <text x="495" y="182" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">menos costo y latencia</text>
  </g>
  <g>
    <rect x="574" y="148" width="134" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="641" y="166" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">ACLs</text>
    <text x="641" y="182" font-size="10.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">ve solo lo permitido</text>
  </g>

  <!-- RAG -->
  <rect x="20" y="280" width="420" height="140" rx="14" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="36" y="304" font-size="14" font-weight="600" fill="#444441">RAG</text>
  <g>
    <rect x="40" y="324" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="130" y="344" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">RAG</text>
    <text x="130" y="364" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">retrieve · augment · generate</text>
  </g>
  <g>
    <rect x="240" y="324" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="330" y="344" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">RAG agéntico</text>
    <text x="330" y="364" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">routing · multi-hop · self-check</text>
  </g>

  <!-- Multiagente -->
  <rect x="460" y="280" width="420" height="140" rx="14" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="476" y="304" font-size="14" font-weight="600" fill="#444441">Multiagente</text>
  <g>
    <rect x="480" y="324" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="570" y="344" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Orquestador / workers</text>
    <text x="570" y="364" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">planifica y delega</text>
  </g>
  <g>
    <rect x="680" y="324" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="770" y="344" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Router / handoff</text>
    <text x="770" y="364" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">deriva por intención</text>
  </g>

  <!-- Evals -->
  <rect x="20" y="450" width="860" height="140" rx="14" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="36" y="474" font-size="14" font-weight="600" fill="#444441">Evals · atraviesa todo</text>
  <g>
    <rect x="40" y="494" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="135" y="514" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Evals</text>
    <text x="135" y="534" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">dataset → correr → medir → arreglar</text>
  </g>
  <g>
    <rect x="250" y="494" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="345" y="514" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Golden dataset</text>
    <text x="345" y="534" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">la vara de todo</text>
  </g>
  <g>
    <rect x="460" y="494" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="555" y="514" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Tool evals</text>
    <text x="555" y="534" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">tool y args correctos</text>
  </g>
  <g>
    <rect x="670" y="494" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="765" y="514" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Multi-agent evals</text>
    <text x="765" y="534" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">la trayectoria, no solo el final</text>
  </g>

  <!-- Flechas entre dominios -->
  <line x1="130" y1="242" x2="130" y2="320" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="422" y1="352" x2="476" y2="352" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>
