<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Embeddings compatibles para documentos y consultas</title><desc id="desc">Documento y pregunta pasan por sus modos de encoder y sus vectores se comparan en un espacio compatible.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="390" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">EMBEDDINGS · DOS ENTRADAS, UN ESPACIO COMPATIBLE</text><rect x="28" y="65" width="400" height="142" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="91" font-size="14" fill="#534AB7" font-weight="600">DOCUMENTOS</text><text x="44" y="121" font-size="22" fill="#534AB7" font-weight="600">Chunk</text><text x="44" y="149" font-size="17" fill="#534AB7" font-weight="400">Encoder: modo documento</text><text x="44" y="173" font-size="17" fill="#534AB7" font-weight="400">→ vector del contenido</text><rect x="472" y="65" width="400" height="142" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="488" y="91" font-size="14" fill="#534AB7" font-weight="600">CONSULTAS</text><text x="488" y="121" font-size="22" fill="#534AB7" font-weight="600">Pregunta</text><text x="488" y="149" font-size="17" fill="#534AB7" font-weight="400">Encoder: modo consulta</text><text x="488" y="173" font-size="17" fill="#534AB7" font-weight="400">→ vector de búsqueda</text><path d="M228 211 V239 H450 V263" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M672 211 V239 H450" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="28" y="269" width="844" height="95" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="48" y="301" font-size="24" fill="#0F6E56" font-weight="600">Comparar similitud → candidatos → reranking</text><text x="48" y="336" font-size="18" fill="#0F6E56" font-weight="400">Misma versión, dimensiones y métrica; respetar el modo de cada entrada.</text></g></svg>
