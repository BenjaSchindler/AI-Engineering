<svg xmlns="http://www.w3.org/2000/svg" width="900" height="684" viewBox="0 0 900 684" role="img" aria-labelledby="title desc">
<title id="title">Tools en MCP · del listado al resultado</title>
<desc id="desc">Arriba, quién decide usar cada primitiva de MCP: las tools, el modelo; los resources, la aplicación; los prompts, el usuario. Abajo, el recorrido de una tool entre modelo, cliente y servidor: tools/list devuelve las definiciones con name, description, inputSchema, outputSchema y annotations; el modelo elige buscar_documentos con sus argumentos; el host muestra las entradas y pide confirmación si es sensible; tools/call envía nombre y argumentos; el servidor valida entradas y permisos y ejecuta. Hay tres salidas: un resultado con content y structuredContent que cumple el outputSchema; un error de ejecución con isError true que vuelve al modelo para que corrija; o un error JSON-RPC de protocolo, como una tool desconocida.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#185FA5" stroke-width="1.5"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
</defs>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect x="0" y="0" width="900" height="684" rx="12" fill="#FBFAF7"/>
<text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">TOOLS EN MCP · DEL LISTADO AL RESULTADO</text>
<rect x="28" y="52" width="272" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="42" y="74" font-size="13.5" fill="#185FA5" font-weight="600">Tools <tspan font-weight="400">· las decide el modelo</tspan></text>
<text x="42" y="96" font-size="12" fill="#5F5E5A">con una persona que pueda negarlas</text>
<rect x="314" y="52" width="272" height="60" rx="10" fill="#F1EFE8" stroke="#444441" stroke-width="1"/>
<text x="328" y="74" font-size="13.5" fill="#444441" font-weight="600">Resources <tspan font-weight="400">· las decide la aplicación</tspan></text>
<text x="328" y="96" font-size="12" fill="#5F5E5A">el host elige qué contexto sumar</text>
<rect x="600" y="52" width="272" height="60" rx="10" fill="#F1EFE8" stroke="#444441" stroke-width="1"/>
<text x="614" y="74" font-size="13.5" fill="#444441" font-weight="600">Prompts <tspan font-weight="400">· los elige el usuario</tspan></text>
<text x="614" y="96" font-size="12" fill="#5F5E5A">por ejemplo, un comando con /</text>
<rect x="50" y="136" width="160" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="130" y="157" font-size="13.5" fill="#534AB7" font-weight="600" text-anchor="middle">Modelo</text>
<path d="M130 168 V462" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<rect x="320" y="136" width="160" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="400" y="157" font-size="13.5" fill="#185FA5" font-weight="600" text-anchor="middle">Cliente (host)</text>
<path d="M400 168 V462" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<rect x="640" y="136" width="160" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="720" y="157" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">Servidor MCP</text>
<path d="M720 168 V462" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<circle cx="24" cy="204" r="10" fill="#444441"/><text x="24" y="208.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">1</text>
<path d="M404 200 H714" stroke="#68675F" stroke-width="1.8"  marker-end="url(#arr)"/>
<text x="560.0" y="193" font-size="12" fill="#68675F" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tools/list</text>
<path d="M716 228 H406" stroke="#68675F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="560.0" y="221" font-size="12" fill="#68675F" text-anchor="middle" >name, description, inputSchema, outputSchema, annotations</text>
<circle cx="24" cy="272" r="10" fill="#444441"/><text x="24" y="276.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">2</text>
<rect x="42.0" y="258" width="176" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="130" y="276" font-size="12" fill="#534AB7" text-anchor="middle">elige buscar_documentos</text>
<path d="M134 308 H394" stroke="#534AB7" stroke-width="1.8"  marker-end="url(#arr)"/>
<text x="265.0" y="301" font-size="12" fill="#534AB7" text-anchor="middle" >query: “reembolso duplicado”, top_k: 3</text>
<circle cx="24" cy="344" r="10" fill="#444441"/><text x="24" y="348.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">3</text>
<rect x="250.0" y="330" width="300" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
<text x="400" y="348" font-size="12" fill="#185FA5" text-anchor="middle">muestra las entradas; si es sensible, confirma</text>
<circle cx="24" cy="398" r="10" fill="#444441"/><text x="24" y="402.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">4</text>
<path d="M404 394 H714" stroke="#185FA5" stroke-width="1.8"  marker-end="url(#arrb)"/>
<text x="560.0" y="387" font-size="12" fill="#185FA5" text-anchor="middle" >tools/call · name + arguments</text>
<rect x="575.0" y="408" width="290" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="720" y="426" font-size="12" fill="#0F6E56" text-anchor="middle">valida entradas y permisos, y ejecuta</text>
<text x="28" y="484" font-size="14" fill="#444441" font-weight="600">5 · Tres salidas posibles</text>
<rect x="28" y="496" width="272" height="96" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="42" y="518" font-size="13.5" fill="#0F6E56" font-weight="600" font-family="inherit">Resultado</text>
<text x="42" y="538" font-size="12" fill="#444441">content y structuredContent;</text>
<text x="42" y="555" font-size="12" fill="#444441">si hay outputSchema, debe cumplirlo</text>
<text x="42" y="580" font-size="11.5" fill="#0F6E56" font-weight="600">vuelve al modelo</text>
<rect x="314" y="496" width="272" height="96" rx="10" fill="#FAEEDA" stroke="#854F0B"/>
<text x="328" y="518" font-size="13.5" fill="#854F0B" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">isError: true</text>
<text x="328" y="538" font-size="12" fill="#444441">“top_k debe estar entre 1 y 5”:</text>
<text x="328" y="555" font-size="12" fill="#444441">error de ejecución o de validación</text>
<text x="328" y="580" font-size="11.5" fill="#854F0B" font-weight="600">el modelo puede corregir y reintentar</text>
<rect x="600" y="496" width="272" height="96" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="614" y="518" font-size="13.5" fill="#993C1D" font-weight="600" font-family="inherit">Error JSON-RPC</text>
<text x="614" y="538" font-size="12" fill="#444441">tool desconocida o petición mal</text>
<text x="614" y="555" font-size="12" fill="#444441">formada: error de protocolo</text>
<text x="614" y="580" font-size="11.5" fill="#993C1D" font-weight="600">difícil que el modelo lo arregle</text>
<text x="28" y="632" font-size="14.5" fill="#444441">Anotaciones como <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">readOnlyHint</tspan> describen la intención: no son barreras y no son confiables</text>
<text x="28" y="652" font-size="14.5" fill="#444441">salvo que vengan de un servidor confiable. El servidor valida y autoriza igual.</text>
<text x="28" y="674" font-size="12" fill="#888780">Especificación MCP 2026-07-28 (tools, resources y prompts), consultada el 25-09-2026. Tool y argumentos ilustrativos.</text>
</g></svg>
