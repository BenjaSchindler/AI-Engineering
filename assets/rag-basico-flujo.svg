<svg xmlns="http://www.w3.org/2000/svg" width="900" height="393" viewBox="0 0 900 393" role="img" aria-labelledby="title desc"><title id="title">RAG básico en dos filas</title><desc id="desc">Pregunta, embedding, recuperación con permisos, reranking, contexto del LLM y respuesta con citas.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="393" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">RAG BÁSICO · PRIMERO BUSCAR, DESPUÉS RESPONDER</text><rect x="28" y="64" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="90" font-size="14" fill="#534AB7" font-weight="600">01</text><text x="44" y="120" font-size="22" fill="#534AB7" font-weight="600">Pregunta</text><text x="44" y="148" font-size="17" fill="#534AB7" font-weight="400">Texto + identidad</text><rect x="320" y="64" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="90" font-size="14" fill="#534AB7" font-weight="600">02</text><text x="336" y="120" font-size="22" fill="#534AB7" font-weight="600">Embedding query</text><text x="336" y="148" font-size="17" fill="#534AB7" font-weight="400">Representar la consulta</text><rect x="612" y="64" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="628" y="90" font-size="14" fill="#534AB7" font-weight="600">03</text><text x="628" y="120" font-size="22" fill="#534AB7" font-weight="600">Recuperar</text><text x="628" y="148" font-size="17" fill="#534AB7" font-weight="400">Top-k + filtros ACL</text><path d="M290 120 H316" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M582 120 H608" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M872 120 H886 V245 H875" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="612" y="193" width="260" height="138" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="628" y="219" font-size="14" fill="#0F6E56" font-weight="600">04</text><text x="628" y="249" font-size="22" fill="#0F6E56" font-weight="600">Rerank</text><text x="628" y="277" font-size="17" fill="#0F6E56" font-weight="400">Ordenar la evidencia</text><rect x="320" y="193" width="260" height="138" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="336" y="219" font-size="14" fill="#0F6E56" font-weight="600">05</text><text x="336" y="249" font-size="22" fill="#0F6E56" font-weight="600">Contexto del LLM</text><text x="336" y="277" font-size="17" fill="#0F6E56" font-weight="400">Instrucciones + evidencia</text><text x="336" y="301" font-size="17" fill="#0F6E56" font-weight="400">+ pregunta</text><rect x="28" y="193" width="260" height="138" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="44" y="219" font-size="14" fill="#0F6E56" font-weight="600">06</text><text x="44" y="249" font-size="22" fill="#0F6E56" font-weight="600">Respuesta</text><text x="44" y="277" font-size="17" fill="#0F6E56" font-weight="400">Generar con citas</text><path d="M317 245 H290" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M609 245 H582" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="28" y="368" font-size="18" fill="#68675F" font-weight="400">La respuesta se apoya en lo recuperado; si falta evidencia, no alcanza con generar.</text></g></svg>
