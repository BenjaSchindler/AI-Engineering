<svg xmlns="http://www.w3.org/2000/svg" width="900" height="566" viewBox="0 0 900 566" role="img" aria-labelledby="title desc">
<title id="title">RAG · DEL ÍNDICE A LA RESPUESTA</title><desc id="desc">La ingesta crea el índice. La consulta pasa por query rewrite, bi-encoder, búsqueda y fusión, cross-encoder y generación con evidencia. Rewrite, búsqueda híbrida y reranking son opcionales.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs>
<rect width="900" height="566" rx="12" fill="#FBFAF7"/>
<g font-family="DejaVu Sans,sans-serif"><text x="28" y="36" font-size="17" fill="#68675F" font-weight="600">RAG · DEL ÍNDICE A LA RESPUESTA</text><rect x="28" y="64" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="96" font-size="21" fill="#534AB7" font-weight="600">Ingesta</text><text x="44" y="126" font-size="17" fill="#534AB7" font-weight="400">Fuentes → chunks</text><text x="44" y="152" font-size="17" fill="#534AB7" font-weight="400">Embeddings de pasajes</text><rect x="320" y="64" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="96" font-size="21" fill="#534AB7" font-weight="600">Índice compartido</text><text x="336" y="126" font-size="17" fill="#534AB7" font-weight="400">Vectores + texto</text><text x="336" y="152" font-size="17" fill="#534AB7" font-weight="400">Metadata y permisos</text><rect x="612" y="64" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="628" y="96" font-size="21" fill="#534AB7" font-weight="600">Pregunta + chat</text><text x="628" y="126" font-size="17" fill="#534AB7" font-weight="400">Conservar la original</text><text x="628" y="152" font-size="17" fill="#534AB7" font-weight="400">para responder</text><path d="M290 120 H316" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="612" y="224" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="628" y="256" font-size="21" fill="#534AB7" font-weight="600">1 · Query rewrite</text><text x="628" y="286" font-size="17" fill="#534AB7" font-weight="400">Consulta clara</text><text x="628" y="312" font-size="17" fill="#534AB7" font-weight="400">Opcional</text><rect x="320" y="224" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="256" font-size="21" fill="#534AB7" font-weight="600">2 · Bi-encoder</text><text x="336" y="286" font-size="17" fill="#534AB7" font-weight="400">Embedding de consulta</text><text x="336" y="312" font-size="17" fill="#534AB7" font-weight="400">Buscar en el índice</text><rect x="28" y="224" width="260" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="256" font-size="21" fill="#534AB7" font-weight="600">3 · Recuperación</text><text x="44" y="286" font-size="17" fill="#534AB7" font-weight="400">Vectores + BM25 / RRF</text><text x="44" y="312" font-size="17" fill="#534AB7" font-weight="400">Híbrida opcional; ACLs</text><path d="M742 178 V220" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M610 280 H584" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M318 280 H292" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M450 178 V220" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="386" width="260" height="112" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="44" y="418" font-size="21" fill="#0F6E56" font-weight="600">4 · Cross-encoder</text><text x="44" y="448" font-size="17" fill="#0F6E56" font-weight="400">Reordenar candidatos</text><text x="44" y="474" font-size="17" fill="#0F6E56" font-weight="400">Opcional</text><rect x="320" y="386" width="260" height="112" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="336" y="418" font-size="21" fill="#0F6E56" font-weight="600">5 · Contexto</text><text x="336" y="448" font-size="17" fill="#0F6E56" font-weight="400">Pregunta + evidencia</text><text x="336" y="474" font-size="17" fill="#0F6E56" font-weight="400">Respetar presupuesto</text><rect x="612" y="386" width="260" height="112" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="628" y="418" font-size="21" fill="#0F6E56" font-weight="600">6 · Respuesta</text><text x="628" y="448" font-size="17" fill="#0F6E56" font-weight="400">LLM + citas</text><text x="628" y="474" font-size="17" fill="#0F6E56" font-weight="400">Según la evidencia</text><path d="M158 338 V382" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M290 442 H316" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M582 442 H608" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="28" y="541" font-size="18" fill="#444441" font-weight="400">La ingesta prepara el índice; cada pregunta recorre la consulta.</text></g></svg>
