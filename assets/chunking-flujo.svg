<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc"><title id="title">Chunking con control de tamaño</title><desc id="desc">Cuatro etapas compactas: estructura, fragmentos, contar tokens con subdivisión si excede, y guardar contexto antes del embedding.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="414" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">CHUNKING · CORTAR, MEDIR Y CONSERVAR EL CONTEXTO</text><rect x="28" y="65" width="400" height="135" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="91" font-size="14" fill="#534AB7" font-weight="600">01</text><text x="44" y="121" font-size="22" fill="#534AB7" font-weight="600">Leer la estructura</text><text x="44" y="149" font-size="17" fill="#534AB7" font-weight="400">Documento → secciones</text><rect x="472" y="65" width="400" height="135" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="488" y="91" font-size="14" fill="#534AB7" font-weight="600">02</text><text x="488" y="121" font-size="22" fill="#534AB7" font-weight="600">Crear fragmentos</text><text x="488" y="149" font-size="17" fill="#534AB7" font-weight="400">Una idea por chunk</text><rect x="472" y="218" width="400" height="135" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="488" y="244" font-size="14" fill="#534AB7" font-weight="600">03</text><text x="488" y="274" font-size="22" fill="#534AB7" font-weight="600">Contar tokens</text><text x="488" y="302" font-size="17" fill="#534AB7" font-weight="400">Input completo: texto + título</text><text x="488" y="326" font-size="17" fill="#534AB7" font-weight="400">+ prefijos; si excede, dividir</text><rect x="28" y="218" width="400" height="135" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="244" font-size="14" fill="#534AB7" font-weight="600">04</text><text x="44" y="274" font-size="22" fill="#534AB7" font-weight="600">Guardar y representar</text><text x="44" y="302" font-size="17" fill="#534AB7" font-weight="400">Fuente + ubicación + ACL</text><text x="44" y="326" font-size="17" fill="#534AB7" font-weight="400">→ embedding</text><path d="M432 128 H468" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M672 203 V214" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M468 286 H432" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M874 283 H887 V131 H874" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="438" y="277" font-size="14" fill="#0F6E56" font-weight="400">sí</text><text x="28" y="390" font-size="19" fill="#68675F" font-weight="400">Si no entra: dividir otra vez y volver a contar. No truncar la evidencia.</text></g></svg>
