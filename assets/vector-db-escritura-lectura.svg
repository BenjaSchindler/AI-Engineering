<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566" role="img" aria-labelledby="title desc"><title id="title">Escritura y lectura de una Vector DB</title><desc id="desc">Dos carriles separados: documentos a chunks, embeddings y upsert; preguntas a embedding, búsqueda con permisos y evidencia. Ambos usan el mismo índice.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="1200" height="566" rx="12" fill="#FBFAF7" stroke="none"/><rect x="16" y="15" width="1168" height="163" rx="12" fill="#F2F0FE" stroke="none"/><text x="32" y="43" font-size="18" fill="#534AB7" font-weight="600">ESCRITURA · cuando cambia el contenido</text><rect x="28" y="60" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="86" font-size="14" fill="#534AB7" font-weight="600">01</text><text x="44" y="115" font-size="22" fill="#534AB7" font-weight="600">Documento</text><text x="44" y="143" font-size="17" fill="#534AB7" font-weight="400">Contenido + permisos</text><rect x="318" y="60" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="334" y="86" font-size="14" fill="#534AB7" font-weight="600">02</text><text x="334" y="115" font-size="22" fill="#534AB7" font-weight="600">Chunks</text><text x="334" y="143" font-size="17" fill="#534AB7" font-weight="400">IDs propios + doc_id</text><rect x="608" y="60" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="624" y="86" font-size="14" fill="#534AB7" font-weight="600">03</text><text x="624" y="115" font-size="22" fill="#534AB7" font-weight="600">Embeddings</text><text x="624" y="143" font-size="17" fill="#534AB7" font-weight="400">Modelo y dimensión</text><rect x="898" y="60" width="250" height="104" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="914" y="86" font-size="14" fill="#534AB7" font-weight="600">04</text><text x="914" y="115" font-size="22" fill="#534AB7" font-weight="600">Upsert</text><text x="914" y="143" font-size="17" fill="#534AB7" font-weight="400">Por chunk_id; guardar doc_id</text><path d="M281 112 H310" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M571 112 H600" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M861 112 H890" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="16" y="321" width="1168" height="163" rx="12" fill="#EFF8F4" stroke="none"/><text x="32" y="349" font-size="18" fill="#0F6E56" font-weight="600">LECTURA · en cada pregunta</text><rect x="28" y="366" width="250" height="104" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="44" y="392" font-size="14" fill="#0F6E56" font-weight="600">01</text><text x="44" y="421" font-size="22" fill="#0F6E56" font-weight="600">Pregunta</text><text x="44" y="449" font-size="17" fill="#0F6E56" font-weight="400">Texto + identidad</text><rect x="318" y="366" width="250" height="104" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="334" y="392" font-size="14" fill="#0F6E56" font-weight="600">02</text><text x="334" y="421" font-size="22" fill="#0F6E56" font-weight="600">Embedding query</text><text x="334" y="449" font-size="17" fill="#0F6E56" font-weight="400">Encoder compatible</text><rect x="608" y="366" width="250" height="104" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="624" y="392" font-size="14" fill="#0F6E56" font-weight="600">03</text><text x="624" y="421" font-size="22" fill="#0F6E56" font-weight="600">Buscar top-k</text><text x="624" y="449" font-size="17" fill="#0F6E56" font-weight="400">Similitud + filtro ACL</text><rect x="898" y="366" width="250" height="104" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="914" y="392" font-size="14" fill="#0F6E56" font-weight="600">04</text><text x="914" y="421" font-size="22" fill="#0F6E56" font-weight="600">Evidencia</text><text x="914" y="449" font-size="17" fill="#0F6E56" font-weight="400">Chunks + fuente + metadata</text><path d="M281 418 H310" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M571 418 H600" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><path d="M861 418 H890" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="450" y="213" width="300" height="67" rx="12" fill="#FAEEDA" stroke="#854F0B"/><text x="509" y="241" font-size="25" fill="#854F0B" font-weight="600">Vector DB</text><text x="473" y="265" font-size="17" fill="#854F0B" font-weight="400">vectores · contenido · permisos</text><path d="M1023 165 V194 H600 V210" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><text x="810" y="189" font-size="15" fill="#68675F" font-weight="400">guardar / actualizar</text><path d="M750 247 H795 V301 H733 V363" stroke="#68675F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><text x="815" y="269" font-size="15" fill="#68675F" font-weight="400">consultar el índice</text><text x="28" y="517" font-size="20" fill="#30302E" font-weight="600">El índice se prepara al escribir; la evidencia se recupera al leer.</text><text x="28" y="545" font-size="18" fill="#68675F" font-weight="400">Después: reranking → contexto del LLM → respuesta con citas.</text></g></svg>
