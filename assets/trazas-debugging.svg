<svg xmlns="http://www.w3.org/2000/svg" width="900" height="648" viewBox="0 0 900 648" role="img" aria-labelledby="title desc">
<title id="title">Trazas y debugging · dónde se fue el tiempo</title>
<desc id="desc">Traza en cascada de una ejecución lenta del agente cotizador: 12,4 segundos en total. La tool calcular_prima vence dos veces por timeout de 3 segundos y el runtime reintenta con esperas; 8 de los 12,4 segundos se van ahí. El span del primer intento muestra estado de error, argumentos y versiones. Desde la versión 3.4 de la tool, su p95 pasó de 1,1 a 3,4 segundos. El recorrido: síntoma, primer paso incorrecto, causa, reproducir y caso de regresión.</desc>
