<rect x="541.0" y="263.1" width="8.0" height="2.9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="551.0" y="256.3" width="8.0" height="9.7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="561.0" y="263.1" width="8.0" height="2.9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="571.0" y="260.2" width="8.0" height="5.8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="581.0" y="263.1" width="8.0" height="2.9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
