<text x="470" y="280" font-size="10.5" fill="#888780" text-anchor="middle">0 s</text>
<text x="570" y="280" font-size="10.5" fill="#888780" text-anchor="middle">2 s</text>
<text x="670" y="280" font-size="10.5" fill="#888780" text-anchor="middle">4 s</text>
<text x="770" y="280" font-size="10.5" fill="#888780" text-anchor="middle">6 s</text>
<text x="870" y="280" font-size="10.5" fill="#888780" text-anchor="middle">8 s</text>
<text x="470" y="308" font-size="12.5" fill="#444441" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">espera = aleatorio(0, min(tope, base · 2^intento))</text>
<text x="470" y="360" font-size="14" fill="#444441" font-weight="600">3 · Disyuntor (circuit breaker)</text>
<rect x="470" y="404" width="112" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="526" y="425" font-size="13" fill="#0F6E56" font-weight="600" text-anchor="middle">Cerrado</text>
<text x="526" y="442" font-size="11" fill="#0F6E56" text-anchor="middle">llama normal</text>
<rect x="616" y="404" width="112" height="50" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="672" y="425" font-size="13" fill="#993C1D" font-weight="600" text-anchor="middle">Abierto</text>
<text x="672" y="442" font-size="11" fill="#993C1D" text-anchor="middle">no llama: fallback</text>
<rect x="762" y="404" width="112" height="50" rx="10" fill="#FAEEDA" stroke="#854F0B"/>
<text x="818" y="425" font-size="13" fill="#854F0B" font-weight="600" text-anchor="middle">Semiabierto</text>
<text x="818" y="442" font-size="11" fill="#854F0B" text-anchor="middle">deja pasar 1 prueba</text>
<path d="M582 429 H612" stroke="#68675F" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="598" y="400" font-size="10.5" fill="#888780" text-anchor="middle">N fallas</text>
<path d="M728 429 H758" stroke="#68675F" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="743" y="468" font-size="10.5" fill="#888780" text-anchor="middle">espera</text>
<path d="M818 454 V482 H526 V458" stroke="#0F6E56" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="670" y="496" font-size="11" fill="#0F6E56" text-anchor="middle">la prueba funciona: vuelve a cerrado</text>
<path d="M800 404 V382 H684 V400" stroke="#993C1D" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
<text x="742" y="377" font-size="10.5" fill="#993C1D" text-anchor="middle">falla</text>
<text x="28" y="410" font-size="14" fill="#444441" font-weight="600">Reintentos en capas se multiplican</text>
<rect x="28" y="424" width="112" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="84" y="442" font-size="12.5" fill="#444441" font-weight="600" text-anchor="middle">SDK</text>
<text x="84" y="459" font-size="12" fill="#5F5E5A" text-anchor="middle">3 intentos</text>
<rect x="152" y="424" width="112" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="208" y="442" font-size="12.5" fill="#444441" font-weight="600" text-anchor="middle">runtime</text>
<text x="208" y="459" font-size="12" fill="#5F5E5A" text-anchor="middle">× 3</text>
<rect x="276" y="424" width="112" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="332" y="442" font-size="12.5" fill="#444441" font-weight="600" text-anchor="middle">orquestador</text>
<text x="332" y="459" font-size="12" fill="#5F5E5A" text-anchor="middle">× 3</text>
<text x="28" y="494" font-size="13" fill="#993C1D" font-weight="600">= hasta 27 llamadas por una sola falla</text>
<text x="28" y="514" font-size="12.5" fill="#5F5E5A">Los SDK de Claude ya reintentan 2 veces por defecto.</text>
<text x="28" y="532" font-size="12.5" fill="#5F5E5A">Una sola capa decide y lleva el presupuesto total.</text>
<text x="28" y="610" font-size="14.5" fill="#444441">Cambiar de proveedor es el último paso: comprobá tools, formato de mensajes, contexto y permisos de datos.</text>
<text x="28" y="634" font-size="14.5" fill="#0F6E56">Y antes de repetir una acción con efectos tras un timeout, confirmá si ya ocurrió.</text>
<text x="28" y="656" font-size="12" fill="#888780">Errores y reintentos según la documentación de la API de Claude; full jitter según AWS Architecture Blog (2015). Consultado el 25-09-2026.</text>
</g></svg>
