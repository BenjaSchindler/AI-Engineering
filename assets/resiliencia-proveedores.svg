<text x="570" y="180" font-size="10.5" fill="#888780" text-anchor="middle">2 s</text>
<text x="670" y="180" font-size="10.5" fill="#888780" text-anchor="middle">4 s</text>
<text x="770" y="180" font-size="10.5" fill="#888780" text-anchor="middle">6 s</text>
<text x="870" y="180" font-size="10.5" fill="#888780" text-anchor="middle">8 s</text>
<text x="470" y="196" font-size="12.5" fill="#0F6E56" font-weight="600">Con full jitter: se reparten</text>
<rect x="471.0" y="249.6" width="8.0" height="16.4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="481.0" y="252.5" width="8.0" height="13.5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
