<rect x="511.0" y="254.4" width="8.0" height="11.6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="521.0" y="262.1" width="8.0" height="3.9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
