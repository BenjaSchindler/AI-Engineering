<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668" viewBox="0 0 900 668" role="img" aria-labelledby="title desc">
<title id="title">Resiliencia entre proveedores · clasificar, reintentar con jitter y cortar</title>
<desc id="desc">Tres partes. 1: clasificar la falla antes de reintentar: 400 se corrige, 401 y 403 son de credencial o permiso, 413 pide achicar, 429 con retry-after espera ese tiempo, 429 por tope de gasto no trae retry-after y hay que detenerse, 500 y 529 se reintentan con espera exponencial y jitter, 504 sugiere streaming, y un timeout de red exige comprobar si la acción ocurrió. 2: sin jitter, los reintentos de muchos clientes caen juntos en 1, 2 y 4 segundos; con full jitter se reparten. 3: un disyuntor pasa de cerrado a abierto tras varias fallas seguidas, deja pasar una prueba en semiabierto y vuelve a cerrado si funciona. Si el SDK, el runtime y el orquestador reintentan cada uno 3 veces, una falla puede generar 27 llamadas.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect x="0" y="0" width="900" height="668" rx="12" fill="#FBFAF7"/>
<text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">RESILIENCIA ENTRE PROVEEDORES · CLASIFICAR ANTES DE REINTENTAR</text>
<text x="28" y="68" font-size="14" fill="#444441" font-weight="600">1 · Qué dice el error</text>
<text x="28" y="86" font-size="12" fill="#888780">códigos de la API de Claude; otros proveedores son parecidos</text>
<rect x="28" y="102" width="82" height="28" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="69" y="121" font-size="12.5" fill="#993C1D" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">400</text>
<text x="122" y="121" font-size="12.5" fill="#444441">corregir la petición; no reintentar</text>
<rect x="28" y="138" width="82" height="28" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="69" y="157" font-size="12.5" fill="#993C1D" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">401 · 403</text>
<text x="122" y="157" font-size="12.5" fill="#444441">credencial o permiso: no reintentar</text>
<rect x="28" y="174" width="82" height="28" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="69" y="193" font-size="12.5" fill="#993C1D" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">413</text>
<text x="122" y="193" font-size="12.5" fill="#444441">petición demasiado grande: achicarla</text>
<rect x="28" y="210" width="82" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B"/>
<text x="69" y="229" font-size="12.5" fill="#854F0B" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">429</text>
<text x="122" y="229" font-size="12.5" fill="#444441">con retry-after: esperar ese tiempo</text>
<rect x="28" y="246" width="82" height="28" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="69" y="265" font-size="12.5" fill="#993C1D" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">429</text>
<text x="122" y="265" font-size="12.5" fill="#444441">tope de gasto, sin retry-after: detener</text>
<rect x="28" y="282" width="82" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="69" y="301" font-size="12.5" fill="#0F6E56" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">500 · 529</text>
<text x="122" y="301" font-size="12.5" fill="#444441">transitorio: espera exponencial + jitter</text>
<rect x="28" y="318" width="82" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
<text x="69" y="337" font-size="12.5" fill="#185FA5" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">504</text>
<text x="122" y="337" font-size="12.5" fill="#444441">respuesta larga: usar streaming</text>
<rect x="28" y="354" width="82" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B"/>
<text x="69" y="373" font-size="12.5" fill="#854F0B" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">timeout</text>
<text x="122" y="373" font-size="12.5" fill="#444441">¿ocurrió la acción? consultar o usar la clave</text>
<text x="470" y="68" font-size="14" fill="#444441" font-weight="600">2 · Reintentos de 60 clientes tras una caída</text>
<text x="470" y="96" font-size="12.5" fill="#993C1D" font-weight="600">Sin jitter: llegan todos juntos</text>
<rect x="521.0" y="108.0" width="8.0" height="58.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="621.0" y="123.5" width="8.0" height="42.5" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="821.0" y="137.0" width="8.0" height="29.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
