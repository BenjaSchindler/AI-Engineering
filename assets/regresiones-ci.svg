<text x="46" y="496" font-size="15" fill="#993C1D" font-weight="700">El gate bloquea la candidata</text>
<text x="46" y="518" font-size="13" fill="#993C1D">“Reintento tras timeout” falla en las 5 repeticiones de v2 y en ninguna de v1: es reproducible y crítico, no ruido.</text>
<text x="28" y="560" font-size="14" fill="#444441">Una suite de regresión debería pasar casi al 100 %. pass<tspan baseline-shift="super" font-size="10">k</tspan> mide que pasen las k corridas: con 75 % por intento, 3 de 3 da 42 %.</text>
<text x="28" y="586" font-size="12.5" fill="#888780">Resultados ilustrativos. Criterios de regresión y pass<tspan baseline-shift="super" font-size="9">k</tspan> según Demystifying evals for AI agents (Anthropic), consultado el 25-09-2026.</text>
