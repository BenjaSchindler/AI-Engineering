<svg xmlns="http://www.w3.org/2000/svg" width="900" height="612" viewBox="0 0 900 612" role="img" aria-labelledby="title desc">
<title id="title">Regresiones y CI · regresión o ruido</title>
<desc id="desc">Una suite de 40 casos corrida 5 veces con la versión base y 5 con la candidata. La tasa de éxito por corrida va de 85 a 90 % en la base y de 83 a 88 % en la candidata: los rangos se superponen y el promedio (87,4 contra 85,4) no distingue. Caso por caso, “reintento tras timeout” pasa 5 de 5 en la base y falla 5 de 5 en la candidata porque duplica la cotización: es reproducible y crítico, así que el gate bloquea. “Moneda EUR” mejora de 3 de 5 a 5 de 5 y “endoso cambia límite” falla 1 de 5 en ambas: eso es variabilidad.</desc>
