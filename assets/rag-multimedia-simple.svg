<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-labelledby="title desc"><title id="title">RAG multimedia en tres pasos</title><desc id="desc">Preparar unidades con ubicación, recuperar el original autorizado ante una pregunta y responder con una cita.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="352" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">MULTIMEDIA · TRES PASOS PARA RECORDAR</text><rect x="28" y="118" width="260" height="142" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="144" font-size="14" fill="#534AB7" font-weight="600">01</text><text x="44" y="174" font-size="22" fill="#534AB7" font-weight="600">Preparar</text><text x="44" y="202" font-size="17" fill="#534AB7" font-weight="400">Página, imagen o escena</text><text x="44" y="226" font-size="17" fill="#534AB7" font-weight="400">→ índice + ubicación</text><rect x="320" y="118" width="260" height="142" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="144" font-size="14" fill="#534AB7" font-weight="600">02</text><text x="336" y="174" font-size="22" fill="#534AB7" font-weight="600">Recuperar</text><text x="336" y="202" font-size="17" fill="#534AB7" font-weight="400">Buscar con permisos</text><text x="336" y="226" font-size="17" fill="#534AB7" font-weight="400">y traer el original</text><rect x="612" y="118" width="260" height="142" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="628" y="144" font-size="14" fill="#0F6E56" font-weight="600">03</text><text x="628" y="174" font-size="22" fill="#0F6E56" font-weight="600">Responder</text><text x="628" y="202" font-size="17" fill="#0F6E56" font-weight="400">El modelo ve la evidencia</text><text x="628" y="226" font-size="17" fill="#0F6E56" font-weight="400">y cita página o tiempo</text><path d="M291 190 H316" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M583 190 H608" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="395" y="78" font-size="19" fill="#0F6E56" font-weight="600">Pregunta</text><path d="M450 87 V114" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="28" y="299" font-size="20" fill="#30302E" font-weight="600">Texto: OCR / transcripción. Visual: embeddings compatibles.</text><text x="28" y="329" font-size="18" fill="#68675F" font-weight="400">El índice encuentra la evidencia; el archivo original permite comprobarla.</text></g></svg>
