<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Embeddings · del contenido a coordenadas</title><desc id="desc">Un chunk de 400 tokens produce, en este ejemplo, un vector de 1024 dimensiones.</desc><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="0" y="0" width="900" height="300" rx="12" fill="#FBFAF7" stroke="none"/><text x="28" y="36" font-size="17" font-weight="600" fill="#5F5E5A">Embeddings · del contenido a coordenadas</text><rect x="28" y="77" width="228" height="156" rx="12" fill="#FAEEDA" stroke="none"/><text x="51" y="116" font-size="23" font-weight="600" fill="#854F0B">Chunk de texto</text><text x="51" y="156" font-size="24" font-weight="400" fill="#854F0B">400 tokens</text><text x="51" y="191" font-size="17" font-weight="400" fill="#854F0B">contenido de entrada</text><path d="M270 151 H314 m-8 -6 l8 6 -8 6" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="77" width="202" height="156" rx="12" fill="#EEEDFE" stroke="none"/><text x="359" y="121" font-size="28" font-weight="600" fill="#534AB7">Encoder</text><text x="359" y="162" font-size="18" font-weight="400" fill="#534AB7">Mismo modelo</text><text x="359" y="192" font-size="18" font-weight="400" fill="#534AB7">para buscar</text><path d="M551 151 H594 m-8 -6 l8 6 -8 6" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="615" y="77" width="257" height="156" rx="12" fill="#E1F5EE" stroke="none"/><text x="636" y="116" font-size="23" font-weight="600" fill="#0F6E56">Vector denso</text><text x="636" y="153" font-size="21" font-weight="400" fill="#0F6E56">[0,12 · −0,08 · …]</text><text x="636" y="191" font-size="20" font-weight="600" fill="#0F6E56">1.024 dimensiones</text><text x="28" y="281" font-size="19" font-weight="400" fill="#30302E">Ejemplo: el largo del texto y el largo del vector son decisiones distintas.</text></g></svg>