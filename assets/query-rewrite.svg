<rect width="900" height="360" rx="12" fill="#FBFAF7"/>
<g font-family="DejaVu Sans,sans-serif"><text x="28" y="36" font-size="17" fill="#68675F" font-weight="600">QUERY REWRITE · ANTES DE RECUPERAR</text><rect x="28" y="64" width="260" height="146" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="44" y="96" font-size="21" fill="#534AB7" font-weight="600">Pregunta del chat</text><text x="44" y="126" font-size="17" fill="#534AB7" font-weight="400">«¿Y cómo lo renuevo?»</text><text x="44" y="152" font-size="17" fill="#534AB7" font-weight="400">Tema: mi pasaporte</text><rect x="320" y="64" width="260" height="146" rx="12" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="96" font-size="21" fill="#534AB7" font-weight="600">Reformular</text><text x="336" y="126" font-size="17" fill="#534AB7" font-weight="400">Resolver el referente</text><text x="336" y="152" font-size="17" fill="#534AB7" font-weight="400">Conservar la intención</text><rect x="612" y="64" width="260" height="146" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="628" y="96" font-size="21" fill="#0F6E56" font-weight="600">Consulta clara</text><text x="628" y="126" font-size="17" fill="#0F6E56" font-weight="400">«¿Cómo renuevo</text><text x="628" y="152" font-size="17" fill="#0F6E56" font-weight="400">mi pasaporte?»</text><path d="M290 137 H316" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M582 137 H608" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="320" y="252" width="552" height="76" rx="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="336" y="284" font-size="21" fill="#0F6E56" font-weight="600">Bi-encoder + búsqueda por palabras</text><path d="M742 212 V248" stroke="#68675F" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/><text x="28" y="278" font-size="18" fill="#444441" font-weight="400">Opcional.</text><text x="28" y="305" font-size="18" fill="#444441" font-weight="400">No inventar datos.</text></g></svg>
