<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Lost in the middle · el mismo dato, en otra posición</title>
<desc id="desc">Tres variantes del mismo caso con 20 documentos, donde solo cambia la posición del documento con la respuesta: al inicio GPT-3.5-Turbo acierta 75,8 %, en el medio 53,8 % y al final 63,2 %. El gráfico muestra la curva en U por posición, la línea sin documentos (56,1 %) y la línea con solo el documento correcto (88,3 %). La brecha del medio es 15,7 puntos. Datos de Liu et al., 2023.</desc>
