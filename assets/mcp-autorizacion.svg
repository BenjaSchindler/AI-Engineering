<svg xmlns="http://www.w3.org/2000/svg" width="900" height="732" viewBox="0 0 900 732" role="img" aria-labelledby="title desc">
<title id="title">Autorización en MCP · del 401 al token con audiencia</title>
<desc id="desc">Secuencia entre navegador, cliente MCP, servidor MCP y servidor de autorización. 1: la petición sin token recibe 401 con WWW-Authenticate, resource_metadata y scope. 2: el cliente lee la Protected Resource Metadata y obtiene el servidor de autorización. 3: descubre su metadata. 4: se registra, preferentemente con un Client ID Metadata Document; el registro dinámico está obsoleto. 5: abre el navegador con PKCE, resource y scope; el usuario inicia sesión y consiente; vuelve un código con iss, que el cliente valida. 6: canjea el código con code_verifier y resource y recibe un access token para ese servidor MCP. 7: envía el token en cada petición; el servidor valida firma, emisor, audiencia, vencimiento y scope, y después aplica la ACL de negocio. Un token inválido recibe 401; un scope insuficiente, 403 con insufficient_scope. El servidor no reenvía el token a otra API.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#68675F" stroke-width="1.5"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#185FA5" stroke-width="1.5"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#993C1D" stroke-width="1.5"/></marker>
</defs>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect x="0" y="0" width="900" height="732" rx="12" fill="#FBFAF7"/>
<text x="28" y="35" font-size="17" fill="#68675F" font-weight="600">AUTORIZACIÓN EN MCP · DEL 401 AL TOKEN CON AUDIENCIA</text>
<rect x="30" y="54" width="156" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="108" y="73" font-size="13.5" fill="#444441" font-weight="600" text-anchor="middle">Navegador</text>
<text x="108" y="90" font-size="12" fill="#444441" text-anchor="middle">usuario</text>
<path d="M108 98 V640" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<rect x="240" y="54" width="156" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="318" y="73" font-size="13.5" fill="#185FA5" font-weight="600" text-anchor="middle">Cliente MCP</text>
<text x="318" y="90" font-size="12" fill="#185FA5" text-anchor="middle">cliente OAuth</text>
<path d="M318 98 V640" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<rect x="482" y="54" width="156" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="560" y="73" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">Servidor MCP</text>
<text x="560" y="90" font-size="12" fill="#0F6E56" text-anchor="middle">resource server</text>
<path d="M560 98 V640" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<rect x="712" y="54" width="156" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="790" y="73" font-size="13.5" fill="#534AB7" font-weight="600" text-anchor="middle">Servidor de</text>
<text x="790" y="90" font-size="12" fill="#534AB7" text-anchor="middle">autorización</text>
<path d="M790 98 V640" stroke="#B4B2A9" stroke-dasharray="3 4"/>
<circle cx="22" cy="144" r="10" fill="#444441"/><text x="22" y="148.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">1</text>
<path d="M322 132 H554" stroke="#68675F" stroke-width="1.8"  marker-end="url(#arr)"/>
<text x="439.0" y="125" font-size="12" fill="#68675F" text-anchor="middle">petición MCP sin token</text>
<path d="M556 162 H324" stroke="#993C1D" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrr)"/>
<text x="439.0" y="155" font-size="12" fill="#993C1D" text-anchor="middle">401 + resource_metadata y scope</text>
<circle cx="22" cy="220" r="10" fill="#444441"/><text x="22" y="224.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">2</text>
<path d="M322 208 H554" stroke="#68675F" stroke-width="1.8"  marker-end="url(#arr)"/>
<text x="439.0" y="201" font-size="12" fill="#68675F" text-anchor="middle">leer Protected Resource Metadata</text>
<path d="M556 238 H324" stroke="#68675F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="439.0" y="231" font-size="12" fill="#68675F" text-anchor="middle">servidores de autorización y scopes</text>
<circle cx="22" cy="296" r="10" fill="#444441"/><text x="22" y="300.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">3</text>
<path d="M322 284 H784" stroke="#68675F" stroke-width="1.8"  marker-end="url(#arr)"/>
<text x="554.0" y="277" font-size="12" fill="#68675F" text-anchor="middle">descubrir su metadata (RFC 8414 u OpenID Connect)</text>
<path d="M786 314 H324" stroke="#68675F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="554.0" y="307" font-size="12" fill="#68675F" text-anchor="middle">endpoints e issuer, que el cliente guarda</text>
<circle cx="22" cy="358" r="10" fill="#444441"/><text x="22" y="362.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">4</text>
<rect x="248" y="342" width="612" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="554.0" y="363" font-size="12" fill="#444441" text-anchor="middle">registro: Client ID Metadata Document (preferido) · pre-registro · registro dinámico (obsoleto)</text>
<circle cx="22" cy="436" r="10" fill="#444441"/><text x="22" y="440.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">5</text>
<path d="M314 414 H114" stroke="#185FA5" stroke-width="1.8"  marker-end="url(#arrb)"/>
<text x="213.0" y="407" font-size="12" fill="#185FA5" text-anchor="middle">abrir /authorize con PKCE, resource y scope</text>
<path d="M112 444 H784" stroke="#68675F" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="449.0" y="437" font-size="12" fill="#68675F" text-anchor="middle">el usuario inicia sesión y consiente</text>
<path d="M786 474 H324" stroke="#68675F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="554.0" y="467" font-size="12" fill="#68675F" text-anchor="middle">redirección con código e iss</text>
<text x="308" y="478" font-size="11.5" fill="#185FA5" text-anchor="end" font-weight="600">valida iss</text>
<circle cx="22" cy="522" r="10" fill="#444441"/><text x="22" y="526.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">6</text>
<path d="M322 510 H784" stroke="#68675F" stroke-width="1.8"  marker-end="url(#arr)"/>
<text x="554.0" y="503" font-size="12" fill="#68675F" text-anchor="middle">canjear código + code_verifier + resource</text>
<path d="M786 540 H324" stroke="#534AB7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="554.0" y="533" font-size="12" fill="#534AB7" text-anchor="middle">access token para https://mcp.ejemplo.com</text>
<circle cx="22" cy="586" r="10" fill="#444441"/><text x="22" y="590.5" font-size="12" fill="#FBFAF7" font-weight="600" text-anchor="middle">7</text>
<path d="M322 574 H554" stroke="#185FA5" stroke-width="1.8"  marker-end="url(#arrb)"/>
<text x="439.0" y="567" font-size="12" fill="#185FA5" text-anchor="middle">Authorization: Bearer … en cada petición</text>
<rect x="556" y="584" width="312" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="568" y="604" font-size="12" fill="#0F6E56" font-weight="600">valida firma, emisor, audiencia, vencimiento</text>
<text x="568" y="622" font-size="12" fill="#0F6E56">y scope; después, la ACL de negocio</text>
<text x="308" y="610" font-size="11.5" fill="#993C1D" text-anchor="end">401: token inválido o vencido</text>
<text x="308" y="628" font-size="11.5" fill="#993C1D" text-anchor="end">403 insufficient_scope: pedir más</text>
<text x="28" y="670" font-size="14.5" fill="#444441">El token es para este servidor: <tspan font-weight="600">no lo reenvía a otra API</tspan>; para llamarla usa su propia credencial.</text>
<text x="28" y="694" font-size="14.5" fill="#0F6E56">Un token válido no da acceso a todos los documentos: el servidor filtra por usuario y tenant.</text>
<text x="28" y="714" font-size="12.5" fill="#888780">Flujo HTTP de la especificación MCP 2026-07-28 (en stdio no aplica), consultada el 25-09-2026.</text>
</g></svg>
